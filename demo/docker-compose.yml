# jnu-vote 데모 (로컬 체인 + DB + 서버 + 화면)
#   심사 모드: demo/start.cmd (Windows) 또는 sh demo/start.sh,   초기화: demo/reset.cmd
#   전시 모드: demo/start-exhibition.cmd 또는 sh demo/start-exhibition.sh,   초기화: demo/reset-exhibition.cmd
#              (EXHIBITION_MODE=1, 프로젝트 이름이 달라 심사 모드와 데이터가 섞이지 않음. 운영자 코드는 demo/.env)
#   접속:   http://localhost:5173
name: jnu-vote-demo

services:
  anvil:
    image: ghcr.io/foundry-rs/foundry:stable
    # 1초 블록: 실제 체인처럼 트랜잭션이 블록에 담기는 시간을 둔다
    entrypoint: ["anvil", "--host", "0.0.0.0", "--chain-id", "31337", "--block-time", "1",
                 "--state", "/data/anvil.json", "--state-interval", "5"]
    ports: ["8545:8545"]
    volumes: ["anvil-data:/data"]
    user: root

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: demo
      TZ: Asia/Seoul
    volumes:
      - mysql-data:/var/lib/mysql
      - ../server/src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-pdemo"]
      interval: 3s
      timeout: 3s
      retries: 60

  deployer:
    build: { context: .., dockerfile: demo/docker/app.Dockerfile }
    image: jnu-vote-demo-app
    depends_on: [anvil]
    environment:
      RPC_URL: http://anvil:8545
      DEPLOYER_KEY: "0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80"
      OUT: /shared/deployment.env
    command: ["sh", "/repo/demo/scripts/deploy-once.sh"]
    volumes: ["shared:/shared"]

  server:
    image: jnu-vote-demo-app
    depends_on:
      deployer: { condition: service_completed_successfully }
      mysql: { condition: service_healthy }
    env_file: [demo.env]
    environment:
      TZ: Asia/Seoul
      EXHIBITION_MODE: ${EXHIBITION_MODE:-0}
      EXHIBITION_ADMIN_CODE: ${EXHIBITION_ADMIN_CODE:-}
    working_dir: /repo/server
    command: ["sh", "-c", "set -a && . /shared/deployment.env && set +a && node src/index.js"]
    ports: ["8080:8080"]
    volumes:
      - shared:/shared
      - ../zkp:/repo/zkp          # 개표 회로 파일 (tally_js, tally_final.zkey)
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 60

  seed:
    image: jnu-vote-demo-app
    depends_on:
      server: { condition: service_healthy }
    env_file: [demo.env]
    environment:
      TZ: Asia/Seoul
      EXHIBITION_MODE: ${EXHIBITION_MODE:-0}
      SEED_API_URL: http://server:8080
      VOTE_WASM: /repo/vote-circuit/voteProof.wasm
      VOTE_ZKEY: /repo/vote-circuit/voteProof_final.zkey
    working_dir: /repo/server
    command: ["node", "scripts/demoSeed.js"]
    volumes:
      - ../front/user/public:/repo/vote-circuit:ro   # 투표 증명 회로 파일 (미리 투표용)
      - ./exhibition.json:/repo/demo/exhibition.json:ro   # 전시 투표 목록 (고치면 이미지를 다시 만들지 않아도 반영)
    restart: "no"

  front:
    build:
      context: ..
      dockerfile: demo/docker/front.Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8080/api
        VITE_RPC_URL: http://localhost:8545
    depends_on: [server]
    ports: ["5173:5173"]

volumes:
  anvil-data:
  mysql-data:
  shared:
